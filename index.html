<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Brief">
<meta name="theme-color" content="#0E1216">
<link rel="manifest" href="/manifest.json">
<title>The Brief</title>
<style>
:root{--bg:#0E1216;--card:#161C21;--card2:#1D242A;--line:#283138;--text:#E6EBEF;--dim:#8A97A2;--faint:#5A6670;--accent:#E9A94A;--alert:#E0705A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);min-height:100%}
body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-size:16px;padding-top:env(safe-area-inset-top)}
button,input,textarea,select{font-family:inherit}
header{padding:26px 20px 14px}
header h1{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
header .date{font-size:13px;color:var(--dim);margin-top:4px}
main{padding:0 16px calc(88px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(14,18,22,.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform}
.tabbar button{flex:1;border:none;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 1px 7px;font-size:10px;font-weight:500}
.tabbar button.on{color:var(--accent)}
.ico{position:relative;display:block;width:24px;height:24px}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-4px;right:-8px;display:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--alert);color:#0E1216;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.card{background:var(--card);border-radius:14px;padding:18px 16px;margin-bottom:12px}
.card.tier-hot{border-left:3px solid var(--alert)}
.card.tier-warm{border-left:3px solid var(--accent)}
.cdot{display:inline-block;width:8px;height:8px;border-radius:2.5px;margin-right:7px;vertical-align:middle;flex:none}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;color:#0E1216;vertical-align:middle}
.timeline{position:relative;padding-left:16px}
.timeline::before{content:'';position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--line)}
.timeline .row{border-top:none;padding:10px 0;position:relative}
.timeline .row::before{content:'';position:absolute;left:-16px;top:18px;width:6px;height:6px;border-radius:2px;background:var(--faint)}
.row.locked{opacity:.5}
.label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.label-ico{display:flex;align-items:center;gap:7px}
.chead{display:flex;align-items:center;gap:8px;cursor:pointer}
.chev{width:14px;height:14px;flex:none;stroke:var(--faint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s ease}
.chev.open{transform:rotate(90deg)}
.label-ico svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setrow{padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:none;padding-top:12px}
.setrow-label{font-size:14.5px;font-weight:600;color:var(--text)}
.setrow-label .sub{font-weight:400;text-transform:none;letter-spacing:0}
.meta{font-size:13px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.empty{font-size:14px;line-height:1.6;color:var(--dim);padding:4px 0}
.row{display:flex;align-items:flex-start;gap:13px;padding:13px 0;border-top:1px solid var(--line);transition:opacity .12s ease}
.row:first-of-type{border-top:none}
.box{width:23px;height:23px;flex:none;border-radius:7px;border:1.5px solid #3A454E;background:transparent;display:flex;align-items:center;justify-content:center;color:#0E1216;font-size:13px;font-weight:800;padding:0}
.box.on{background:var(--accent);border-color:var(--accent)}
.box:active{transform:scale(.9)}
.box,.btn{transition:transform .09s ease,background .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97);opacity:.85}
.txt{flex:1;font-size:16px;line-height:1.4;min-width:0}
.sub{display:block;font-size:12.5px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums}
.x{border:none;background:none;color:var(--faint);font-size:19px;line-height:1;padding:2px 4px}
.addsub{border:none;background:none;color:var(--faint);font-size:18px;font-weight:600;line-height:1;padding:2px 7px;flex:none}
.addsub:active{opacity:.6}
.pinbtn{border:none;background:none;padding:2px 4px;flex:none;color:var(--faint)}
.pinbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none}
.pinbtn.on{color:var(--accent)}
.pinbtn.on svg{fill:currentColor}
.swatches{display:flex;gap:12px}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0}
.swatch.sel{border-color:var(--text)}
.secrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.secrow:first-child{border-top:none}
.secrow.off{opacity:.45}
.secrow .txt{flex:1;font-size:14.5px}
.eyebtn{border:none;background:none;color:var(--faint);padding:2px;flex:none}
.eyebtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ordbtn{border:none;background:var(--card2);color:var(--dim);width:28px;height:28px;border-radius:8px;flex:none;font-size:13px}
.ordbtn:disabled{opacity:.3}
.grouphead{font-size:12.5px;font-weight:700;color:var(--dim);padding:16px 0 4px;border-top:1px solid var(--line)}
.grouphead:first-child{border-top:none;padding-top:0}
.row.subtask{padding:9px 0 9px 34px;border-top:1px dashed var(--line)}
.row.subtask .box{width:19px;height:19px;border-radius:6px}
.row.subtask .txt{font-size:14.5px}
.row.subtask-input{padding-left:34px;align-items:center}
.row.subtask-input input{padding:9px 11px;font-size:14px}
.checkline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;color:var(--dim)}
.checkline input{width:auto;flex:none;accent-color:var(--accent)}
.filepick{display:block;margin-top:9px;background:var(--card2);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--dim)}
.filepick input{display:block;margin-top:7px;width:100%;color:var(--dim);font-size:12px}
.lockline{color:var(--faint)!important}
.copybtn{flex:none;border:none;background:var(--card2);color:var(--faint);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;padding:0;margin-left:auto;transition:transform .09s ease,background .15s ease,color .15s ease}
.copybtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copybtn:active{transform:scale(.88)}
.copybtn.done{background:var(--accent);color:#0E1216}
.copybtn.done svg{display:none}
.copybtn.done::after{content:'\2713';font-size:13px;font-weight:800}
.focus .copybtn{margin-left:10px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--dim);margin-left:6px}
.pill.hot{background:var(--alert);color:#0E1216}
.pill.warm{background:var(--accent);color:#0E1216}
.pill.quiet{background:transparent;color:var(--faint);padding:2px 4px}
.attnico{width:13px;height:13px;stroke:var(--alert);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-right:6px;flex:none}
.draftbox{background:var(--card2);border-radius:9px;padding:11px 13px;margin:0 0 10px}
.draftbox .sub{font-size:14px;line-height:1.5}
.pribtn{border:none;font-family:inherit;line-height:inherit;vertical-align:middle;cursor:pointer;-webkit-appearance:none;appearance:none}
.stagesel{width:auto;flex:none;font-size:12px;padding:5px 8px;background:var(--card2);color:var(--dim);border-radius:7px;margin-left:8px}
.projpills{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin:-4px 0 12px}
.projpill{flex:none;white-space:nowrap;margin-left:0}
.pbar{display:inline-block;width:44px;height:6px;border-radius:3px;background:var(--card2);overflow:hidden;vertical-align:middle;margin-left:7px}
.pbar-fill{display:block;height:100%;background:var(--accent);border-radius:3px}
.pbar-fill.full{background:var(--dim)}
.pbar-label{font-size:10.5px;color:var(--faint);margin-left:4px;font-variant-numeric:tabular-nums;vertical-align:middle}
.res{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.res:first-of-type{border-top:none}
.res-body{flex:1;min-width:0}
.res .k{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.res .n{font-size:15.5px;line-height:1.35;margin-top:3px}
.res .l{font-size:12.5px;color:var(--faint);line-height:1.45;margin-top:3px}
.res-thumb{display:block;width:56px;height:56px;flex:none;object-fit:cover;border-radius:9px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;display:block}
.lightbox-close{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;border:none;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:18px;font-size:20px;line-height:1;padding:0}
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:0 0 10px}
.stale{font-size:12px;color:var(--faint);text-align:center;padding:2px 0 10px}
.hi{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding:2px 2px 16px}
.hi h2{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0;line-height:1.15}
.hi .sub{font-size:14px;color:var(--dim);margin-top:5px}
.next{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.next .dot{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(233,169,74,.14);display:flex;align-items:center;justify-content:center}
.next .dot svg{width:21px;height:21px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.next .mid{flex:1;min-width:0}
.next .lab{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.next .ttl{font-size:18px;font-weight:600;margin-top:3px;line-height:1.25}
.next .when{font-size:13px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums}
.next .away{flex:none;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.duo{display:flex;gap:10px;margin-bottom:12px}
.duo>div{flex:1;min-width:0;background:var(--card);border-radius:14px;padding:15px 13px}
.duo .label{margin-bottom:11px}
.mini{display:flex;gap:9px;padding:7px 0;align-items:flex-start}
.mini .t{flex:none;width:56px;font-size:12px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums}
.mini .n{flex:1;font-size:13px;line-height:1.35;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis}
.mini .n.now{color:var(--accent);font-weight:600}
.tlallday{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tlwrap{position:relative;height:230px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
mask-image:linear-gradient(to bottom, black calc(100% - 18px), transparent 100%);
-webkit-mask-image:linear-gradient(to bottom, black calc(100% - 18px), transparent 100%)}
.tlgrid{position:relative;margin-left:34px}
.tltick{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.55}
.tltick span{position:absolute;left:-34px;top:-6px;width:30px;font-size:9px;color:var(--faint);text-align:right}
.tlev{position:absolute;border-radius:6px;padding:3px 6px;overflow:hidden;color:#0E1216;cursor:pointer;z-index:1}
.tlev-t{font-size:10.5px;font-weight:700;line-height:1.25;display:block}
.tlnow{position:absolute;left:0;right:0;height:2px;background:var(--alert);z-index:2}
.tlnow::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--alert)}
.more{display:block;font-size:12.5px;font-weight:600;color:var(--accent);margin-top:10px;text-decoration:none}
.focus{display:flex;align-items:center;gap:13px;background:var(--card);border-left:3px solid var(--accent);border-radius:12px;padding:15px;margin-bottom:12px}
.focus .lab{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.focus .ttl{font-size:16px;font-weight:600;margin-top:4px;line-height:1.3}
.focus.hot{border-left-color:var(--alert)}
.focus.hot .lab{color:var(--alert)}
.wx{display:flex;align-items:center;gap:12px}
.wx .deg{font-size:28px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
.wx .desc{font-size:12.5px;color:var(--dim);margin-top:4px}
.wx-rain{font-size:12px;color:var(--accent);margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.wxicon{width:52px;height:52px;flex:none}
.wx-sun-rays{stroke:#F0B23D;stroke-width:3;stroke-linecap:round;animation:wxspin 24s linear infinite}
.wx-sun-body{fill:#FFC94D;animation:wxpulse 3s ease-in-out infinite}
.wx-cloud{animation:wxdrift 6s ease-in-out infinite}
.wx-cloud-back{animation:wxdrift 7s ease-in-out infinite reverse}
.wx-fog line{stroke:#C7CEDB;stroke-width:2.5;stroke-linecap:round}
.wx-fog line:nth-child(1){animation:wxfog 4s ease-in-out infinite}
.wx-fog line:nth-child(2){animation:wxfog 4.5s ease-in-out infinite .3s}
.wx-fog line:nth-child(3){animation:wxfog 4s ease-in-out infinite .6s}
.wx-drop line{stroke:#5B9BD5;stroke-width:2.5;stroke-linecap:round}
.wx-drop{animation:wxfall 1s linear infinite}
.wx-d2{animation-delay:.25s}
.wx-d3{animation-delay:.5s}
.wx-flake{fill:#E8F0FC;animation:wxflake 3s ease-in-out infinite}
.wx-f2{animation-delay:.6s}
.wx-f3{animation-delay:1.2s}
.wx-bolt{animation:wxbolt 2.2s ease-in-out infinite}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wxdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes wxfog{0%,100%{opacity:.35;transform:translateX(-3px)}50%{opacity:.9;transform:translateX(3px)}}
@keyframes wxfall{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes wxflake{0%{transform:translate(0,0);opacity:0}20%{opacity:1}50%{transform:translate(3px,6px)}100%{transform:translate(-2px,12px);opacity:0}}
@keyframes wxbolt{0%,88%,100%{opacity:0}90%,94%{opacity:1}}
.grid{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.px{width:11px;height:11px;border-radius:2.5px;background:#1B2228}
.px.l1{background:#3D4A2E}.px.l2{background:#5E7539}
.px.l3{background:#8FA13F}.px.l4{background:var(--accent)}
.px.today{box-shadow:0 0 0 1.5px var(--text)}
.legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--faint)}
.streak{display:flex;gap:20px;margin:4px 0 14px}
.streak div{flex:1}
.streak b{display:block;font-size:26px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}
.streak span{font-size:11.5px;color:var(--faint)}
.bars{display:flex;gap:3px;align-items:flex-end;height:38px;margin-top:6px}
.bars i{flex:1;background:var(--card2);border-radius:2px;min-height:2px}
.bars i.on{background:var(--accent)}
.review{background:var(--card2);border-radius:11px;padding:14px;margin-bottom:9px}
.review .txt{font-size:15px}
.acts{display:flex;gap:8px;margin-top:11px}
input,textarea,select{width:100%;color:var(--text);background:var(--card2);border:1px solid transparent;border-radius:10px;padding:12px 13px;font-size:16px}
input::placeholder,textarea::placeholder{color:var(--faint)}
select{-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{outline:none;border-color:#3A454E}
textarea{line-height:1.55;resize:vertical;min-height:120px}
.logvoice{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;line-height:1.65;letter-spacing:-.01em}
.pair{display:flex;gap:8px;align-items:center;margin-top:9px}
.btn{border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;background:var(--card2);color:var(--text);white-space:nowrap}
.btn:disabled{opacity:.5}
.btn.solid{background:var(--accent);color:#0E1216}
.btn.small{padding:9px 13px;font-size:13px}
a{color:var(--accent);text-decoration:none}
#gate{padding:90px 28px;text-align:center}
#gate h1{font-size:22px;font-weight:650;margin:0 0 6px}
#gate p{font-size:14px;color:var(--dim);margin:0 0 26px}
#gate input{max-width:240px;margin:0 auto 14px;text-align:center;letter-spacing:.18em}
#gate .btn{width:100%;max-width:240px}
.err{color:var(--alert);font-size:13.5px;margin-top:16px;line-height:1.5}
.spin{color:var(--faint);font-size:14px;padding:34px 0;text-align:center}
</style>
</head>
<body>
<div id="gate" style="display:none">
<h1>The Brief</h1>
<p>Enter your passcode</p>
<input id="pass" type="password" placeholder="&bull;&bull;&bull;&bull;" autocomplete="off">
<button class="btn solid" onclick="unlock()">Open</button>
<div class="err" id="gateErr"></div>
</div>
<div id="app" style="display:none">
<header>
<h1>The Brief</h1>
<div class="date" id="today"></div>
</header>
<main id="main"><div class="spin">Loading&hellip;</div></main>
<nav class="tabbar">
<button data-tab="today" class="on">
<span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg><span class="badge"></span></span>
Today
</button>
<button data-tab="tasks">
<span class="ico"><svg viewBox="0 0 24 24"><path d="M3.5 7.5l2 2 3.5-3.5M3.5 17l2 2 3.5-3.5M13 7.5h7.5M13 17h7.5"/></svg><span class="badge"></span></span>
Tasks
</button>
<button data-tab="log">
<span class="ico"><svg viewBox="0 0 24 24"><path d="M5 19.5V11M12 19.5V4.5M19 19.5v-6"/></svg><span class="badge"></span></span>
Log
</button>
<button data-tab="info">
<span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 10h4M7 14h7"/><circle cx="16.5" cy="10" r="1.6"/></svg><span class="badge"></span></span>
Info
</button>
<button data-tab="db">
<span class="ico"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.5" ry="2.5"/><path d="M4.5 6v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5V6"/><path d="M4.5 12v6c0 1.4 3.4 2.5 7.5 2.5s7.5-1.1 7.5-2.5v-6"/></svg><span class="badge"></span></span>
Database
</button>
<button data-tab="set">
<span class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg><span class="badge"></span></span>
Settings
</button>
</nav>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/*
 * Shared icon set for module headers — small, line-based, 24x24 viewBox,

/*
 * On iPhone, tapping a mail.google.com link hands it to the Gmail app via
 * iOS's Universal Links — and the Gmail app doesn't honour the #all/<id>
 * part the way a browser does, so it just opens to a generic view. This is
 * an OS-level handoff that happens before any of our code runs; there's no
 * URL trick that reliably overrides it. What Apple's own documentation
 * confirms DOES bypass it: pasting a URL directly into Safari's address
 * bar. So alongside the tap link, offer a copy button — paste into Safari
 * and it opens correctly every time. Falls back to a hidden-textarea copy
 * for browser contexts without the Clipboard API.
 */
function copyBtn(link){
if(!link) return '';
return '<button class="copybtn" data-link="'+esc(link)+'" onclick="copyLink(this,event)" aria-label="Copy link" title="Copy link — paste into Safari to open the exact email">'
+ '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>'
+ '</button>';

function copyLink(btn,ev){
if(ev){ ev.preventDefault(); ev.stopPropagation(); }
const link = btn.getAttribute('data-link');
if(!link) return;
const done = function(){
btn.classList.add('done');
setTimeout(function(){ btn.classList.remove('done'); }, 1300);
};
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(link).then(done).catch(function(){ fallbackCopy(link, done); });
} else {
fallbackCopy(link, done);
}
}
function fallbackCopy(text, cb){
const ta = document.createElement('textarea');
ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
document.body.appendChild(ta); ta.focus(); ta.select();
try{ document.execCommand('copy'); }catch(e){}
document.body.removeChild(ta);
if(cb) cb();
}

const r = await fetch(url);
const d = await r.json();
const nowH = new Date().getHours();
const probs = (d.hourly && d.hourly.precipitation_probability) || [];
let from = -1, to = -1;
for(let i = nowH; i < probs.length && i < 24; i++){
if(probs[i] >= 50){ if(from < 0) from = i; to = i; }
else if(from >= 0) break;
}
const label = n => {
const ap = n >= 12 ? 'pm' : 'am', h = n % 12 === 0 ? 12 : n % 12;
return h + ap;
};
WX = {
now: Math.round((d.current && d.current.temperature_2m) || 0),
hi: Math.round((d.daily && d.daily.temperature_2m_max[0]) || 0),
lo: Math.round((d.daily && d.daily.temperature_2m_min[0]) || 0),
code: (d.current && d.current.weather_code),
desc: WX_CODES[(d.current && d.current.weather_code)] || '',
rain: from >= 0 ? (from === to ? ('around ' + label(from)) : (label(from) + ' to ' + label(to + 1))) : ''
};
}catch(e){ WX = { error: true }; }
if(TAB === 'today') $('#main').innerHTML = viewToday();
}

function greeting(){
const x = new Date().getHours();
return x < 12 ? 'Good morning' : x < 17 ? 'Good afternoon' : 'Good evening';
}

function toMins(hhmm){
if(!hhmm || hhmm.indexOf(':')<0) return -1;
const p = hhmm.split(':');
return parseInt(p[0],10)*60 + parseInt(p[1],10);
}

const TL_START_HOUR = 5, TL_END_HOUR = 23, TL_PX_PER_HOUR = 40;

function timelineHtml(events, nowMins){
const list = events || [];
const timed = list.filter(function(e){ return !e.allDay; });
const allDay = list.filter(function(e){ return e.allDay; });
const rangeStart = TL_START_HOUR*60, rangeEnd = TL_END_HOUR*60;
const totalPx = (TL_END_HOUR-TL_START_HOUR)*TL_PX_PER_HOUR;

const blocks = timed.map(function(e, i){
const s = Math.max(toMins(e.start), rangeStart);
let en = toMins(e.end);
if(en<0 || en<=s) en = s+30;
en = Math.min(en, rangeEnd);
return {i:i, e:e, s:s, en:en};
}).filter(function(b){ return b.s < rangeEnd && b.en > rangeStart; })
.sort(function(a,b){ return a.s-b.s; });

// Overlapping events split the available width evenly within their
// cluster, rather than the column-packing algorithms full calendar apps
// use — reasonable for a compact widget where double-bookings are the
// exception, not the common case.
let clusters = [];
blocks.forEach(function(b){
const hit = clusters.find(function(c){ return c.some(function(x){ return b.s<x.en && b.en>x.s; }); });
if(hit) hit.push(b); else clusters.push([b]);
});
let merged = true;
while(merged){
merged = false;
for(let a=0; a<clusters.length; a++){
for(let bI=a+1; bI<clusters.length; bI++){
const overlap = clusters[a].some(function(x){ return clusters[bI].some(function(y){ return x.s<y.en && x.en>y.s; }); });
if(overlap){ clusters[a] = clusters[a].concat(clusters[bI]); clusters.splice(bI,1); merged = true; break; }
}
if(merged) break;
}
}
const posByIdx = {};
clusters.forEach(function(cl){
cl.sort(function(a,b){ return a.s-b.s; });
cl.forEach(function(b, col){ posByIdx[b.i] = {col:col, of:cl.length}; });
});

const eventBlocks = blocks.map(function(b){
const top = (b.s-rangeStart)/60*TL_PX_PER_HOUR;
const height = Math.max((b.en-b.s)/60*TL_PX_PER_HOUR, 20);
const pos = posByIdx[b.i] || {col:0, of:1};
const widthPct = 100/pos.of, leftPct = widthPct*pos.col;
const color = hueFor(b.e.calendar || 'default');
const timeLbl = clock(b.e.start)+(b.e.end?'\u2013'+clock(b.e.end):'');
return '<div class="tlev" style="top:'+top+'px;height:'+height+'px;left:calc('+leftPct+'% + 2px);width:calc('+widthPct+'% - 4px);background:'+color+'" '
+ 'data-title="'+esc(b.e.title)+'" data-time="'+esc(timeLbl)+'" data-where="'+esc(b.e.where||'')+'" data-cal="'+esc(b.e.calendar||'')+'" '
+ 'onclick="showEventDetail(event)"><span class="tlev-t">'+esc(b.e.title)+'</span></div>';
}).join('');

const hourTicks = [];
for(let h=TL_START_HOUR; h<=TL_END_HOUR; h++){
const top = (h*60-rangeStart)/60*TL_PX_PER_HOUR;
const label = h===12 ? '12pm' : (h>12 ? (h-12)+'pm' : h+'am');
hourTicks.push('<div class="tltick" style="top:'+top+'px"><span>'+label+'</span></div>');
}

const nowTop = (nowMins-rangeStart)/60*TL_PX_PER_HOUR;
const nowLine = (nowMins>=rangeStart && nowMins<=rangeEnd) ? '<div class="tlnow" style="top:'+nowTop+'px"></div>' : '';

const allDayHtml = allDay.length
? '<div class="tlallday">' + allDay.map(function(e){ return '<span class="pill" style="margin-left:0;background:'+hueFor(e.calendar||'default')+';color:#0E1216">'+esc(e.title)+'</span>'; }).join('') + '</div>'
: '';

if(!timed.length && !allDay.length) return '<div class="empty" style="font-size:13px">Nothing booked.</div>';

return allDayHtml
+ '<div class="tlwrap" id="tlwrap">'
+ '<div class="tlgrid" style="height:'+totalPx+'px">' + hourTicks.join('') + eventBlocks + nowLine + '</div>'
+ '</div>'
+ '<div id="evDetail"></div>';
}

function scrollTimelineToNow(){
const el = $('#tlwrap');
if(!el) return;
const now = new Date();
const nowMins = now.getHours()*60 + now.getMinutes();
const before = 90;   // minutes of context kept visible before "now"
const top = Math.max(0, (nowMins - TL_START_HOUR*60 - before)/60*TL_PX_PER_HOUR);
el.scrollTop = top;
}

function awayLabel(mins){

function needsAttentionItems(P, D){

(P.certs||[]).forEach(function(c){

if(c.lapsed || c.days<=14){
items.push({ rank: c.lapsed ? -1000-Math.abs(c.days) : c.days,

}
});
(D.open||[]).forEach(function(t){
if(!t.due || t.status==='Done') return;
const days = Math.round((new Date(t.due+'T12:00:00') - new Date(new Date().toDateString()))/86400000);
if(days<=2){
items.push({ rank: days,
text: esc(t.name)+' &mdash; '+(days<0?(Math.abs(days)+'d overdue'):(days===0?'due today':'due in '+days+'d')), icon:'list' });

items.sort(function(a,b){ return a.rank-b.rank; });
return items.slice(0,4);

function viewTasks(){
const all = D.open || [];
const byId = {};
all.forEach(function(t){ byId[t.id] = t; });

// A task only counts as a subtask while its parent is itself still open —
// if the parent gets completed or binned, its remaining subtasks fall back
// to being shown as ordinary top-level tasks on the very next render,
// rather than silently vanishing from the list.
const childrenOf = {};
const topLevel = [];
all.forEach(function(t){
if(t.parent && byId[t.parent]){
(childrenOf[t.parent] = childrenOf[t.parent] || []).push(t);
} else {
topLevel.push(t);
}
});

// Tasks carrying a Project are clustered under a small header, in the
// order each project first appears. Tasks with no Project keep the
// original flat, oldest-first layout — no empty "No project" header.
const projectOrder = [], projectGroups = {}, loose = [];
topLevel.forEach(function(t){
if(t.project){
if(!projectGroups[t.project]){ projectGroups[t.project] = []; projectOrder.push(t.project); }
projectGroups[t.project].push(t);
} else {
loose.push(t);
}
});

function subtaskInput(parentId){
return '<div class="row subtask subtask-input">'
+ '<input id="nst-'+parentId+'" placeholder="Subtask" onkeydown="if(event.key===\'Enter\')addSubtask(\''+parentId+'\')">'
+ `<button class="btn small" onclick="addSubtask('${parentId}')">Add</button></div>`;
}

const PRIORITY_CYCLE = {'':'Low', 'Low':'Medium', 'Medium':'High', 'High':''};
function progressBar(p){
if(!p || !p.total) return '';
const pct = Math.round(p.done/p.total*100);
const full = p.done>=p.total;
return '<span class="pbar" aria-label="'+p.done+' of '+p.total+' done">'
+ '<span class="pbar-fill'+(full?' full':'')+'" style="width:'+pct+'%"></span></span>'
+ '<span class="pbar-label">'+p.done+'/'+p.total+'</span>';
}

function priorityPill(t){
const cls = t.priority==='High' ? 'hot' : (t.priority==='Medium' ? 'warm' : '');
return '<button class="pill pribtn '+cls+'" onclick="cyclePriority(\''+t.id+'\',\''+(t.priority||'')+'\')" aria-label="Priority, tap to change">'
+ esc(t.priority || 'Priority') + '</button>';
}
function cyclePriority(id, current){
const next = PRIORITY_CYCLE[current] !== undefined ? PRIORITY_CYCLE[current] : 'Low';
optimistic(function(){
const t = (D.open||[]).find(function(x){ return x.id===id; });
if(t) t.priority = next;
}, 'setTaskPriority', {id:id, priority:next});
}

const STATUS_CYCLE = {'Open':'Waiting', 'Waiting':'Blocked', 'Blocked':'Open'};
function statusPill(t){
const s = t.status || 'Open';
const cls = s==='Blocked' ? 'hot' : (s==='Waiting' ? 'warm' : 'quiet');
return '<button class="pill pribtn '+cls+'" onclick="cycleStatus(\''+t.id+'\',\''+s+'\')" aria-label="Status, tap to change">'
+ esc(s) + '</button>';
}
function cycleStatus(id, current){
const next = STATUS_CYCLE[current] || 'Waiting';
optimistic(function(){
const t = (D.open||[]).find(function(x){ return x.id===id; });
if(t) t.status = next;
}, 'setStatus', {id:id, status:next});
}

function dueLabel(due){
if(!due) return '';
const d = new Date(due+'T12:00:00');
const days = Math.round((d - new Date(new Date().toDateString())) / 86400000);
if(days < 0) return Math.abs(days)+'d overdue';
if(days === 0) return 'due today';
return 'due in '+days+'d';
}

function taskRow(t, isSub, hideProject){
const kids = childrenOf[t.id] || [];
const dueLbl = dueLabel(t.due);
const repeatIco = t.repeat ? '<svg class="attnico" style="stroke:var(--faint)" viewBox="0 0 24 24">'+ICONS.repeat+'</svg>' : '';
const sub = [!isSub && !hideProject && t.project, dueLbl, t.age>13 ? t.age+' days old' : ''].filter(Boolean).join(' &middot; ');
const subChip = (!isSub && t.progress) ? progressBar(t.progress) : '';
return '<div class="row'+(isSub?' subtask':'')+'">'
+ `<button class="box" onclick="completeTask('${t.id}')"></button>`
+ '<span class="txt">'+esc(t.name)+subChip+(!isSub?priorityPill(t):'')+(!isSub?statusPill(t):'')+(sub?'<span class="sub">'+repeatIco+sub+'</span>':(repeatIco?'<span class="sub">'+repeatIco+'repeats '+esc(t.repeat).toLowerCase()+'</span>':''))+'</span>'
+ (isSub ? '' : `<button class="addsub" onclick="toggleSubtaskInput('${t.id}')" aria-label="Add subtask">+</button>`)
+ `<button class="x" onclick="binTask('${t.id}')">&times;</button></div>`
+ (!isSub && SUBTASK_FOR===t.id ? subtaskInput(t.id) : '')
+ kids.map(function(k){ return taskRow(k, true, hideProject); }).join('');
}

const groupsHtml = projectOrder.map(function(proj){
return '<div class="grouphead"><span class="cdot" style="background:'+hueFor(proj)+'"></span>'+esc(proj)+'</div>'
+ projectGroups[proj].map(function(t){ return taskRow(t, false, true); }).join('');
}).join('');
const looseHtml = loose.map(function(t){ return taskRow(t, false, false); }).join('');

async function reloadProjects(){
try{ PROJECTS = (await api('projects')).projects || []; }
catch(e){}
if(TAB==='tasks') render();
}

async function addProject(){
const n = $('#pn').value.trim(); if(!n) return;
if(busy) return; busy = true;
const kEl = $('#pk'), priEl = $('#ppri'), btn = $('#addProjBtn');
if(btn){ btn.disabled = true; btn.textContent = 'Adding\u2026'; }
try{
const args = {name:n};
if(kEl && kEl.value) args.kind = kEl.value;
if(priEl && priEl.value) args.priority = priEl.value;
await api('addProject', args);
$('#pn').value = '';
if(kEl) kEl.value = '';
if(priEl) priEl.value = '';
await reloadProjects();
}catch(e){ alert(e.message); }
busy = false;
if(btn){ btn.disabled = false; btn.textContent = 'Add project'; }
}

function cycleProjectPriority(id, current){
const next = PRIORITY_CYCLE[current] !== undefined ? PRIORITY_CYCLE[current] : 'Low';
const p = (PROJECTS||[]).find(function(x){ return x.id===id; });
if(p) p.priority = next;
render();
api('setProjectPriority', {id:id, priority:next}).catch(function(e){ alert(e.message); reloadProjects(); });
}

function setProjectStage(id, stage){
const p = (PROJECTS||[]).find(function(x){ return x.id===id; });
if(p) p.stage = stage;
api('setProjectStage', {id:id, stage:stage}).catch(function(e){ alert(e.message); reloadProjects(); });
}

function setProjectDone(id){
PROJECTS = (PROJECTS||[]).filter(function(x){ return x.id!==id; });
render();
api('setProjectStatus', {id:id, status:'Done'}).catch(function(e){ alert(e.message); reloadProjects(); });
}

function dropProject(id){
PROJECTS = (PROJECTS||[]).filter(function(x){ return x.id!==id; });
render();
api('setProjectStatus', {id:id, status:'Dropped'}).catch(function(e){ alert(e.message); reloadProjects(); });
}

function pickProjectPill(name){
const el = $('#np');

}

function addTask(){
const n = $('#nt').value.trim(); if(!n) return;
const priEl = $('#npri'), dueEl = $('#ndue'), repEl = $('#nrep');
const projectText = $('#np').value.trim();
const args = {name:n, project:projectText};
const matched = projectText && (PROJECTS||[]).find(function(p){ return p.name===projectText; });
if(matched) args.projectId = matched.id;
if(priEl && priEl.value) args.priority = priEl.value;
if(dueEl && dueEl.value) args.due = dueEl.value;
if(repEl && repEl.value) args.repeat = repEl.value;
act('addTask', args);
if(priEl) priEl.value = '';
if(dueEl) dueEl.value = '';
if(repEl) repEl.value = '';
}

function sensitiveBar(){

return '<div class="card"><span class="meta" style="margin:0">Sensitive info unlocked for this session</span>'

}
return '<div class="card">' + labelIco('Sensitive info', 'lock', 'Some records are hidden until unlocked')
+ '<div style="height:10px"></div>'
+ '<div class="pair"><input id="sensPass" type="password" placeholder="Password" '

let SENSITIVE_TIMER = null;
const SENSITIVE_TIMEOUT_MS = 3*60*1000;   // 3 minutes

function armSensitiveRelock(){
if(SENSITIVE_TIMER) clearTimeout(SENSITIVE_TIMER);
SENSITIVE_TIMER = setTimeout(function(){
SENSITIVE_TIMER = null;
if(!SENSITIVE_CODE) return;   // already relocked some other way
relockSensitive();
}, SENSITIVE_TIMEOUT_MS);
}

async function unlockSensitive(){
const el = $('#sensPass');
const v = (el ? el.value : '').trim();
if(!v) return;
try{
const r = await api('info', {unlock:v});
const stillLocked = (r.records||[]).some(function(x){ return x.sensitive && x.locked; });
if(stillLocked){ alert('That password is wrong.'); return; }
SENSITIVE_CODE = v;
INFO = r;
armSensitiveRelock();
if(TAB==='info') $('#main').innerHTML = viewInfo();
}catch(e){ alert(e.message); }
}

function relockSensitive(){
if(SENSITIVE_TIMER){ clearTimeout(SENSITIVE_TIMER); SENSITIVE_TIMER = null; }
SENSITIVE_CODE = null;
INFO = null; loadInfo();
}

function copySensitiveValue(value){
if(!navigator.clipboard || !navigator.clipboard.writeText) return;
navigator.clipboard.writeText(value).then(function(){
setTimeout(function(){ navigator.clipboard.writeText('').catch(function(){}); }, 30000);
}).catch(function(){});
}
function copySensitiveClick(e){
e.preventDefault(); e.stopPropagation();
const btn = e.currentTarget;
const v = btn.getAttribute('data-val');
if(!v) return;
copySensitiveValue(v);
const orig = btn.textContent;
btn.textContent = 'Copied';
setTimeout(function(){ btn.textContent = orig; }, 1500);
}

function copyPlainClick(e){
e.preventDefault(); e.stopPropagation();
const btn = e.currentTarget;
const v = btn.getAttribute('data-val');
if(!v || !navigator.clipboard || !navigator.clipboard.writeText) return;
navigator.clipboard.writeText(v).catch(function(){});
const orig = btn.textContent;
btn.textContent = 'Copied';
setTimeout(function(){ btn.textContent = orig; }, 1500);
}

function showDraftBox(btn, text, who, subj, days){
const row = btn.closest('.row');
if(!row || !row.parentNode){ alert(text); return; }
const next = row.nextElementSibling;
if(next && next.classList.contains('draftbox')) next.remove();
const box = document.createElement('div');
box.className = 'draftbox';
box.innerHTML = '<div class="sub draft-text" style="white-space:pre-wrap;color:var(--text)">'+esc(text)+'</div>'
+ '<div style="height:6px"></div>'
+ '<button class="pill pribtn quiet draft-copy-btn" data-val="'+esc(text)+'" onclick="copyPlainClick(event)">Copy</button>'
+ '<button class="pill pribtn quiet draft-polish-btn" data-who="'+esc(who||'')+'" data-subj="'+esc(subj||'')+'" data-days="'+esc(days||'')+'" onclick="polishDraftClick(event)">Polish with AI</button>';
row.parentNode.insertBefore(box, row.nextSibling);
}

async function polishDraftClick(e){
const btn = e.currentTarget;
if(btn.disabled) return;
const who = btn.getAttribute('data-who');
const subj = btn.getAttribute('data-subj');
const days = btn.getAttribute('data-days');
btn.disabled = true;
const orig = btn.textContent;
btn.textContent = 'Polishing\u2026';
try{
const r = await api('draftFollowUp', {who:who, subject:subj, days:days});
const box = btn.closest('.draftbox');
if(box){
const textEl = box.querySelector('.draft-text');
if(textEl) textEl.textContent = r.text;
const copyEl = box.querySelector('.draft-copy-btn');
if(copyEl) copyEl.setAttribute('data-val', r.text);
if(r.cost){
const costSpan = document.createElement('span');
costSpan.className = 'meta';
costSpan.style.cssText = 'margin-left:6px;display:inline';
costSpan.textContent = '~$'+r.cost.toFixed(4)+' spent polishing this';
box.appendChild(costSpan);
}
}
btn.remove();
}catch(e2){
btn.disabled = false;
btn.textContent = orig;
alert(e2.message);
}
}

function isImageFile(file){
if(file.type && file.type.indexOf('image/') === 0) return true;
return /\.(heic|heif|jpe?g|png|gif|webp|bmp|tiff?)$/i.test(file.name||'');
}

function loadBitmap(file){
if(window.createImageBitmap) return createImageBitmap(file);
return new Promise(function(resolve, reject){
const img = new Image();
img.onload = function(){ resolve(img); };
img.onerror = reject;
img.src = URL.createObjectURL(file);
});
}

function drawAndExport(bitmap, w, h, quality){
return new Promise(function(resolve){
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
canvas.toBlob(function(blob){ resolve(blob); }, 'image/jpeg', quality);
});
}

function blobToBase64(blob){
return new Promise(function(resolve, reject){
const reader = new FileReader();
reader.onload = function(){
const result = String(reader.result||'');
resolve(result.slice(result.indexOf(',')+1));
};
reader.onerror = reject;
reader.readAsDataURL(blob);
});
}

/*
 * Resize + re-encode as JPEG, trading quality for size rather than just
 * rejecting anything over the limit. Steps quality down first (least
 * visible loss), then falls back to shrinking dimensions if quality alone
 * can't get there — a few tries is normally enough for a phone photo.
 */
async function compressToFit(file, maxBytes){
const bitmap = await loadBitmap(file);
let width = bitmap.width || bitmap.naturalWidth;
let height = bitmap.height || bitmap.naturalHeight;
const MAX_DIM = 2000;
if(Math.max(width, height) > MAX_DIM){
const scale = MAX_DIM / Math.max(width, height);
width = Math.round(width*scale); height = Math.round(height*scale);
}
let quality = 0.85;
let blob = await drawAndExport(bitmap, width, height, quality);
let tries = 0;
while(blob.size > maxBytes && tries < 6){
if(quality > 0.4) quality -= 0.12;
else { width = Math.round(width*0.82); height = Math.round(height*0.82); }
blob = await drawAndExport(bitmap, width, height, quality);
tries++;
}
if(bitmap.close) bitmap.close();
return blob;
}

async function pickFile(inputId, labelId, setFile){
const input = $('#'+inputId);
const file = input && input.files && input.files[0];
const label = $('#'+labelId);
setFile(null);
if(!file){
if(label) label.textContent = 'Attach a photo, video, or PDF (photos over 3MB compress automatically)';
return;
}
const MAX = 3*1024*1024;

if(file.size <= MAX){
if(label) label.textContent = 'Reading '+file.name+'\u2026';
try{
const b64 = await blobToBase64(file);
setFile({name:file.name, type:file.type, data:b64});
if(label) label.textContent = file.name+' ready to attach';
}catch(e){
if(label) label.textContent = "Couldn't read that file \u2014 try again.";
}
return;
}

if(!isImageFile(file)){
if(label) label.textContent = file.name+' is '+(Math.round(file.size/1024/1024*10)/10)+'MB \u2014 about 3MB max from here, and video/PDF can\'t be shrunk in the app. Add it directly in Notion instead.';
input.value = '';
return;
}

if(label) label.textContent = 'Compressing '+file.name+'\u2026';
try{
const blob = await compressToFit(file, MAX);
if(blob.size > MAX){
if(label) label.textContent = 'Still too big even compressed \u2014 try a smaller crop, or add it directly in Notion.';
input.value = '';
return;
}
const b64 = await blobToBase64(blob);
const jpgName = String(file.name||'photo').replace(/\.[^.]+$/, '')+'.jpg';
setFile({name:jpgName, type:'image/jpeg', data:b64});
const fromMB = Math.round(file.size/1024/1024*10)/10;
const toMB = Math.round(blob.size/1024/1024*10)/10;
if(label) label.textContent = jpgName+' ready \u2014 compressed from '+fromMB+'MB to '+toMB+'MB';
}catch(e){
if(label) label.textContent = "Couldn't compress that photo \u2014 add it directly in Notion instead.";
input.value = '';
}
}

async function loadHist(){

function dayKey(d){
const p = n => (n<10?'0':'')+n;
return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function histStats(){
if(!HIST || HIST.error || !HIST.days) return null;
const total = HIST.total || 0;
const today = new Date();
const cells = [];
for(let i=119;i>=0;i--){
const d = new Date(today); d.setDate(d.getDate()-i);
const k = dayKey(d);
const rec = HIST.days[k];
const n = rec ? rec.done.length : 0;
cells.push({key:k, n:n, isToday:i===0, level: !total||!n ? 0 : Math.min(4, Math.ceil(n/total*4))});
}
let streak = 0;
for(let i=cells.length-1;i>=0;i--){
if(cells[i].n>0) streak++;
else if(i!==cells.length-1) break;
else continue;
}
let best = 0, run = 0;
cells.forEach(function(c){ if(c.n>0){run++; if(run>best) best=run;} else run=0; });
const last30 = cells.slice(-30);
const hit = last30.filter(function(c){return c.n>0;}).length;
return {cells:cells, streak:streak, best:best, hit:hit, total:total};
}

if(!HIST){ loadHist(); return '<div class="card">' + labelIco('Streaks','flame') + '<div class="empty">Loading&hellip;</div></div>'; }

const s = histStats();
if(!s) return '';
const week = s.cells.slice(-7).map(function(c){
const pc = s.total ? Math.round(c.n/s.total*100) : 0;
return '<i class="'+(c.n?'on':'')+'" style="height:'+Math.max(6,pc*0.36)+'px"></i>';
}).join('');
return '<div class="card">' + labelIco('Streaks','flame')
+ '<div style="height:12px"></div>'

+ '</div>'

+ '</div>'

+ '<span class="px l3"></span><span class="px l4"></span><span>more</span></div>'
+ '</div>';
}

function isStandalone(){
return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
}

function b64u(s){
const pad = '='.repeat((4 - s.length % 4) % 4);
const raw = atob((s + pad).replace(/-/g,'+').replace(/_/g,'/'));
const out = new Uint8Array(raw.length);
for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
return out;
}

async function refreshPush(){
const el = $('#pushBox'); if(!el) return;
if(!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)){
el.textContent = "This browser can't do notifications."; return;
}
if(!isStandalone()){
el.innerHTML = 'Add The Brief to your home screen and open it from there. iOS only allows notifications for installed apps, never for a tab in Safari.';
return;
}
try{
const reg = await navigator.serviceWorker.ready;
const sub = await reg.pushManager.getSubscription();
if(sub && Notification.permission === 'granted'){
el.innerHTML = '<span style="color:var(--accent);font-weight:600">On</span>'
+ '<span style="color:var(--dim)"> &mdash; briefs arrive at 7am and 7pm</span><br>'
+ '<button class="btn small" style="margin-top:12px" onclick="testPush()">Send a test</button>';
} else {
el.innerHTML = '<button class="btn solid" onclick="enablePush()">Turn on notifications</button>';
}
}catch(e){ el.textContent = e.message; }
}

async function enablePush(){
try{
const perm = await Notification.requestPermission();
if(perm !== 'granted'){
alert('Notifications were declined. Settings, then Notifications, then The Brief to change it.');
return;
}
const reg = await navigator.serviceWorker.ready;
const kr = await fetch('/api/push?action=key', {headers:{'x-passcode':PASS}});
const kj = await kr.json();
if(!kr.ok) throw new Error(kj.error || 'could not get key');
const sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u(kj.publicKey)});
const sr = await fetch('/api/push?action=subscribe', {
method:'POST',
headers:{'Content-Type':'application/json','x-passcode':PASS},
body: JSON.stringify({subscription: sub.toJSON()})
});
const sj = await sr.json();
if(!sr.ok) throw new Error(sj.error || 'could not register');
refreshPush();
}catch(e){ alert(e.message); }
}

async function testPush(){
try{
const r = await fetch('/api/push?action=send', {
method:'POST',
headers:{'Content-Type':'application/json','x-passcode':PASS},
body: JSON.stringify({title:'The Brief', body:'Notifications are working.', url:'/'})
});
const j = await r.json();
if(!r.ok) throw new Error(j.error);
if(!j.sent) alert('Registered, but nothing was sent. Try turning notifications off and on again.');
}catch(e){ alert(e.message); }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){});
boot();
